name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 外部依存は使わない。標準ライブラリだけで動く。
      - name: 検証スクリプトの自己テスト
        run: python3 tools/test_validate_data.py
      - name: データを全件検証する
        run: python3 tools/validate_data.py
